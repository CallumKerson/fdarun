[package]
name = "fdarun"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
description = "Give allowlisted launchd jobs Full Disk Access on macOS"
repository = "https://github.com/CallumKerson/fdarun"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
